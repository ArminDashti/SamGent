services:
  api:
    build: ./api
    ports:
      - "3980:3980"
    environment:
      PORT: "3980"
      SQLITE_PATH: /data/samgent.db
      JWT_SECRET: samgent-dev-jwt-change-me
      ADMIN_USERNAME: armin
      ADMIN_PASSWORD: dopadopa123
      CORS_ORIGIN: http://localhost:3981
    volumes:
      - samgent-sqlite:/data
    restart: unless-stopped

  webui:
    build:
      context: ./webui
      args:
        VITE_API_URL: http://localhost:3980
    ports:
      - "3981:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  samgent-sqlite:
